<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
    font-family: Arial, Helvetica, sans-serif;
    background-color: #f0f0f1;
    margin: 0;
    padding: 20px;
    display: flex;
    justify-content: center;
  }
  .formulario {
    background-color: white;
    width: 100%;
    max-width: 600px;
    padding: 30px;
    border-radius: 12px;
    box-shadow: 0 4px 12px #cccccc;
  }
  h2 {
    text-align: center;
    color: #38a829;
  }
  label {
    display: block;
    margin-top: 15px;
    margin-bottom: 6px;
    font-weight: bold;
    color: #18a543;
  }
  input, select, textarea {
    width: 100%;
    padding: 12px;
    border: 1px solid #d0d0d0;
    border-radius: 8px;
    font-size: 15px;
    background-color: #f9fafa;
    box-sizing: border-box;
  }
  textarea {
    height: 120px;
    resize: vertical;
  }
  button {
    background-color: #3b9238;
    color: white;
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    cursor: pointer;
    margin-top: 20px;
  }
</style>
</head>
