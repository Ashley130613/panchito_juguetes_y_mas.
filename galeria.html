        .galeria{
            display: flex;
            justify-content: center;
            gap: 25px;
            margin-top: 40px;
        }
        .galeria img{
            width: 250px;
            height: 180px;
            object-fit: cover;
            border-radius: 15px;
            border: 3px solid #ddb137;
            box-shadow: 0 4px 10px #999;
            transition: all 0.3s;
        }
        .galeria img:hover{
            transform: scale(1.1);
            border-color: #999;
            box-shadow: 0 10px 25px #66bb;
            cursor: pointer;

        }

        }
        nav a:hover{

        }

            cursor: pointer;
